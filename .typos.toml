[files]
extend-exclude = [
    "examples/advisor-corpus/mcp-local.json",
    "packages/PerfCheckerWeb/src/assets/advisor-panel.js",
    "src/advice.jl",
    "src/advisor.jl",
    "test/advisor_mcp.jl",
    # French conversation fixtures are deliberately exercised by the MCP tests.
    "test/advisor_chat.jl",
    "website/documentation-plan.md",
    "website/src/public/examples/bibliography/timing-evidence.json",
    # Generated Bonito/WGLMakie bundles and sessions retain their exact exported bytes.
    "website/src/public/examples/plot-assets/**",
    # Exact Julia runtime type names are evidence, not editable English prose.
    "website/src/public/examples/real-packages/*-diagnostics/heap-types.json",
    "website/src/public/examples/real-packages/*-diagnostics/heap-types.plot.json",
    "website/src/public/examples/real-packages/*-diagnostics/heap-types.html",
    # Captured Julia dependency names (including Missings) must remain exact.
    "website/src/public/examples/tool-recipes/environment.json",
]

[default]
# Keep hashes and embedded recorded binary assets out of English spelling.
extend-ignore-identifiers-re = ['^[0-9a-f]{8,}$']
# tasklist's output-format switch is an exact Windows CLI option.
extend-ignore-re = ['[A-Za-z0-9+/]{100,}={0,2}', '/FO CSV /NH']
