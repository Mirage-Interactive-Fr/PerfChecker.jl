schema = "perfchecker-collection/1"

[components.analyzers]
depends = ["core", "contracts"]
paths = ["providers/", "test/latest_analyzers.jl", "test/environments/analyzers/"]
suites = ["analyzers"]

[components.contracts]
depends = []
paths = ["schemas/", "qualification/"]
suites = ["contracts"]

[components.core]
depends = []
paths = ["src/", "bin/", "Project.toml", "Manifest.toml", "test/", "ext/", "examples/", "data/", "perf/"]
suites = ["core", "native", "shared", "legacy_interfaces", "legacy_protocol"]

[components.docs]
depends = ["core", "contracts", "web", "pluto", "plots", "analyzers", "vscode"]
paths = ["website/", "ext/DocumenterExt/", "ext/DocumenterVitepressExt/"]
suites = ["docs"]

[components.plots]
depends = ["core", "contracts"]
paths = ["packages/PerfCheckerMakie/"]
suites = ["plots"]

[components.pluto]
depends = ["core", "contracts"]
paths = ["packages/PerfCheckerPluto/"]
suites = ["pluto"]

[components.vscode]
depends = ["core", "contracts"]
paths = ["clients/vscode/"]
suites = ["vscode"]

[components.web]
depends = ["core", "contracts"]
paths = ["packages/PerfCheckerWeb/"]
suites = ["web", "advisor_http1", "advisor_http2"]

[sources.vscode]
repository = "Mirage-Interactive-Fr/PerfCheckerVSCode"
revision = "ba854aa1f0d145f9ee29f3fd3cdedcb4301537c0"

