<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:14px system-ui,sans-serif;color:#213547;background:#f7f9fc;margin:0;padding:12px}*{box-sizing:border-box}h1{font-size:18px}.controls{display:flex;flex-wrap:wrap;gap:12px}svg{width:100%;min-width:620px;background:white;border:1px solid #ccd4df;border-radius:10px}.scroll{overflow:auto}svg text{fill:#374151;font-size:12px}circle:focus{outline:2px solid #222}output{display:block;min-height:44px;padding:8px;background:#e8eef4}label{cursor:pointer}table{border-collapse:collapse;font-size:12px}td,th{padding:5px;border:1px solid #ccd4df}</style>
<h1 id="title"></h1><div class="controls" id="controls"></div><div class="scroll"><svg viewBox="0 0 800 360" role="group" aria-label="Overlaid normalized measurements"></svg></div><output id="readout" aria-live="polite">Hover or focus a point to read its value.</output><p id="description"></p><details><summary>Raw values and ratios</summary><div class="scroll"><table><thead><tr><th>Metric</th><th>Version</th><th>Value</th><th>Unit</th><th>Ratio</th><th>Status</th></tr></thead><tbody></tbody></table></div></details>
<script>
const plot=__PERFCHECKER_NORMALIZED_PLOT__;
const svg=document.querySelector('svg'),ns='http://www.w3.org/2000/svg',colors=['#087e8b','#b46a22','#7655ad','#3372b7'];
const metrics=[...new Set(plot.data.map(r=>r.metric))],hidden=new Set(),versions=plot.options.versions;
document.querySelector('#title').textContent=plot.title;document.querySelector('#description').textContent=plot.description;
const element=(name,attrs,text)=>{const n=document.createElementNS(ns,name);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n};
const label=r=>r.version+' · '+r.metric+': '+r.value+' '+r.unit+' · ratio '+(r.ratio??'unavailable')+' · '+r.normalization_status;
for(const [i,metric]of metrics.entries()){const l=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=true;input.addEventListener('change',()=>{input.checked?hidden.delete(metric):hidden.add(metric);draw()});l.append(input,metric.replace('julia.',''));l.style.color=colors[i%4];document.querySelector('#controls').append(l)}
for(const r of plot.data){const tr=document.createElement('tr');for(const value of [r.metric,r.version,r.value,r.unit,r.ratio??'unavailable',r.normalization_status]){const td=document.createElement('td');td.textContent=value;tr.append(td)}document.querySelector('tbody').append(tr)}
function draw(){svg.replaceChildren();const max=Math.max(1,...plot.data.filter(r=>!hidden.has(r.metric)).map(r=>r.ratio??0))*1.15,x=v=>60+versions.indexOf(v)*700/Math.max(1,versions.length-1),y=r=>295-r/max*250;
for(const tick of [0,1,max]){svg.append(element('line',{x1:60,x2:770,y1:y(tick),y2:y(tick),stroke:'#aab4c0','stroke-dasharray':tick===1?'5 4':'1 0'}),element('text',{x:50,y:y(tick)+4,'text-anchor':'end'},tick.toFixed(tick>1?1:0)+'×'))}
svg.append(element('text',{x:60,y:20},plot.options.statistic+' per version / '+plot.options.reference_version+' reference for each metric'));
for(const [i,metric]of metrics.entries()){if(hidden.has(metric))continue;const rows=plot.data.filter(r=>r.metric===metric);let d='',connected=false;for(const r of rows){if(r.ratio===null){connected=false;continue}d+=(connected?' L':' M')+x(r.version)+','+y(r.ratio);connected=true}svg.append(element('path',{d,fill:'none',stroke:colors[i%4],'stroke-width':2.5}));for(const r of rows){if(r.ratio===null)continue;const dot=element('circle',{cx:x(r.version),cy:y(r.ratio),r:4,fill:colors[i%4],tabindex:0,'aria-label':label(r)});dot.append(element('title',{},label(r)));for(const event of ['mouseenter','focus','click'])dot.addEventListener(event,()=>document.querySelector('#readout').textContent=label(r));svg.append(dot)}}
for(const v of versions)svg.append(element('text',{x:x(v),y:322,'text-anchor':'middle'},v));svg.append(element('text',{x:400,y:350,'text-anchor':'middle'},'Package version'))}
draw();
</script></html>
