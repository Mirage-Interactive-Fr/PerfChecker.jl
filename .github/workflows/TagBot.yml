name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: write
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
concurrency:
  group: tagbot-${{ github.repository }}
  cancel-in-progress: false
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          # Optional PAT needs Contents and Workflows write access for workflow-changing commits.
          token: ${{ secrets.TAGBOT_TOKEN || secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.TAGBOT_SSH_KEY }}
      - name: Tag PerfCheckerLinuxPerf
        uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.TAGBOT_TOKEN || secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.TAGBOT_SSH_KEY }}
          subdir: packages/PerfCheckerLinuxPerf
      - name: Tag PerfCheckerLIKWID
        uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.TAGBOT_TOKEN || secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.TAGBOT_SSH_KEY }}
          subdir: packages/PerfCheckerLIKWID
      - name: Tag PerfCheckerMakie
        uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.TAGBOT_TOKEN || secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.TAGBOT_SSH_KEY }}
          subdir: packages/PerfCheckerMakie
      - name: Tag PerfCheckerPluto
        uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.TAGBOT_TOKEN || secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.TAGBOT_SSH_KEY }}
          subdir: packages/PerfCheckerPluto
      - name: Tag PerfCheckerTachikoma
        uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.TAGBOT_TOKEN || secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.TAGBOT_SSH_KEY }}
          subdir: packages/PerfCheckerTachikoma
      - name: Tag PerfCheckerWeb
        uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.TAGBOT_TOKEN || secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.TAGBOT_SSH_KEY }}
          subdir: packages/PerfCheckerWeb
