name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JULIA_NUM_THREADS: '1'
  JULIA_NUM_PRECOMPILE_TASKS: '1'
  JULIA_NUM_GC_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  UV_THREADPOOL_SIZE: '1'

jobs:
  formatter:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: [1]
        julia-arch: [x86]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - name: Check the exact required Julia formatting
        run: |
          julia --startup-file=no -e 'using Pkg; Pkg.add(Pkg.PackageSpec(name="JuliaFormatter", version="1.0.50"))'
          julia --startup-file=no qualification/scripts/style.jl

  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: '1', os: ubuntu-latest, arch: x64}
          - {version: '1', os: ubuntu-latest, arch: x86}
          - {version: lts, os: ubuntu-latest, arch: x64}
          - {version: lts, os: ubuntu-latest, arch: x86}
          - {version: pre, os: ubuntu-latest, arch: x64}
          - {version: pre, os: ubuntu-latest, arch: x86}
          # The protected context keeps its name; macOS 26 runs natively on Intel.
          - {version: '1', os: macOS-latest, arch: x64, runner: macos-26-intel}
          - {version: '1', os: windows-latest, arch: x64}
          - {version: '1', os: windows-latest, arch: x86}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
