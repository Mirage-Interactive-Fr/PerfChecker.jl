name: Documentation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publication:
        description: Documentation to publish (recovery choices reuse only the reviewed retained export)
        type: choice
        options: [dev, stable, recover-1.1.1, recover-1.1.1-after-3h]
        default: dev
        required: true
      stable_version:
        description: Optional published stable tag (for example v1.0.0); requires docs_source_revision and publication=stable on main
        type: string
        required: false
      docs_source_revision:
        description: Optional immutable documentation-only source commit (full 40-character SHA); requires stable_version
        type: string
        required: false
      reviewed_export_asset:
        description: Optional release asset ID for a locally rendered stable export; publication only, no build or tests
        type: string
        required: false
      reviewed_export_sha256:
        description: Required SHA256 of that exact reviewed ZIP, supplied with reviewed_export_asset
        type: string
        required: false
      reclaim_cancelled_lock:
        description: Only for recover-1.1.1; allow removing its inspected empty lock from the cancelled original job
        type: boolean
        default: false
        required: false
      reclaim_3h_recovery_lock:
        description: Only for recover-1.1.1-after-3h; allow removal of the inspected empty lock attributed to cancelled run 38571832707
        type: boolean
        default: false
        required: false

permissions:
  contents: read

# A new push must not interrupt an active publisher. PR builds can be replaced.
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JULIA_NUM_THREADS: '1'
  JULIA_NUM_GC_THREADS: '1'
  JULIA_NUM_PRECOMPILE_TASKS: '1'
  JULIA_PKG_PRECOMPILE_AUTO: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  UV_THREADPOOL_SIZE: '1'
  NODE_OPTIONS: '--v8-pool-size=1'

jobs:
  documentation:
    if: github.event.deleted != true && !(github.event_name == 'workflow_dispatch' && (inputs.publication == 'recover-1.1.1' || inputs.publication == 'recover-1.1.1-after-3h' || inputs.reviewed_export_asset != ''))
    name: Build documentation exports and test SFTP publication
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      stable-version: ${{ steps.version.outputs.stable-version }}
      source-revision: ${{ steps.version.outputs.source-revision }}
      explicit-source: ${{ steps.version.outputs.explicit-source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        id: docs-julia
        with:
          version: '1'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: julia-actions/cache@v3
      - name: Test publication policy and real SSH/SFTP authentication
        working-directory: website
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:sftp
      - name: Select the documented version
        id: version
        shell: bash
        env:
          REFRESH_STABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.publication == 'stable' }}
          PERFCHECKER_DOCS_STABLE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.publication == 'stable' }}
          PERFCHECKER_DOCS_SOURCE_VERSION: ${{ inputs.stable_version }}
          PERFCHECKER_DOCS_SOURCE_REVISION: ${{ inputs.docs_source_revision }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {documentationSourceConfiguration} from './website/deploy-sftp.mjs';
          const source = documentationSourceConfiguration(process.env);
          appendFileSync(process.env.GITHUB_OUTPUT, `source-revision=${source.revision}\nexplicit-source=${source.explicit}\n`);
          NODE
          if [[ -n "$PERFCHECKER_DOCS_SOURCE_VERSION" ]]; then
            version=${PERFCHECKER_DOCS_SOURCE_VERSION#v}
          else
            version=$(julia --startup-file=no -e 'using TOML; print(TOML.parsefile("Project.toml")["version"])')
          fi
          if [[ "$GITHUB_REF_TYPE" == tag || "$REFRESH_STABLE" == true ]]; then
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a stable tagged version"; exit 1; }
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "Documentation tag differs from the package version"; exit 1; }
          fi
          if [[ "$REFRESH_STABLE" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "Stable documentation refresh requires main"; exit 1; }
            git fetch --no-tags --depth=1 origin "refs/tags/v$version:refs/tags/v$version"
          fi
          echo "PERFCHECKER_DOCS_VERSION=$version" >> "$GITHUB_ENV"
          echo "stable-version=v$version" >> "$GITHUB_OUTPUT"
          SELECTED_DOCS_VERSION="$version" julia --startup-file=no -e '
            version = VersionNumber(ENV["SELECTED_DOCS_VERSION"])
            println("companion-apis=", v"1.0.1" <= version < v"2.0.0")' >> "$GITHUB_OUTPUT"
      - name: Check out the explicit immutable documentation source
        if: steps.version.outputs.explicit-source == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.source-revision }}
          path: stable-doc-source
          persist-credentials: false
      - name: Verify the explicit stable package and documentation source
        if: steps.version.outputs.explicit-source == 'true'
        env:
          SOURCE_REVISION: ${{ steps.version.outputs.source-revision }}
          STABLE_VERSION: ${{ steps.version.outputs.stable-version }}
        run: |
          git -C stable-doc-source fetch --no-tags --depth=1 origin "refs/tags/$STABLE_VERSION:refs/tags/$STABLE_VERSION"
          julia --startup-file=no -e 'using TOML; @assert "v" * TOML.parsefile("stable-doc-source/Project.toml")["version"] == ENV["STABLE_VERSION"]'
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {fetchStableDocumentationCompanions, validateStableDocumentationSource} from './website/deploy-sftp.mjs';
          await fetchStableDocumentationCompanions('stable-doc-source', process.env.STABLE_VERSION, process.env.SOURCE_REVISION);
          await validateStableDocumentationSource('stable-doc-source', process.env.STABLE_VERSION, process.env.SOURCE_REVISION, {
            onCompanionSource: source => {
              console.log('Documentation companion source: ' + JSON.stringify(source));
              for (const [key, value] of Object.entries(source))
                appendFileSync(process.env.GITHUB_ENV, `PERFCHECKER_DOCS_RENDERER_${key.toUpperCase()}=${value}\n`);
            }
          });
          NODE
      - name: Install documentation dependencies
        if: steps.version.outputs.explicit-source != 'true'
        run: julia --startup-file=no --project=website -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Install explicit stable documentation dependencies
        if: steps.version.outputs.explicit-source == 'true'
        working-directory: stable-doc-source
        run: |
          julia --startup-file=no --project=website -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
          npm ci --prefix website --ignore-scripts --no-audit --no-fund
      - name: Verify stable documentation has the released package source
        if: github.event_name == 'workflow_dispatch' && inputs.publication == 'stable' && steps.version.outputs.explicit-source != 'true'
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {fetchStableDocumentationCompanions, validateStableDocumentationSource} from './website/deploy-sftp.mjs';
          const version = 'v' + process.env.PERFCHECKER_DOCS_VERSION;
          await fetchStableDocumentationCompanions(process.cwd(), version, process.env.GITHUB_SHA);
          await validateStableDocumentationSource(process.cwd(), version, process.env.GITHUB_SHA, {
            onCompanionSource: source => {
              console.log('Documentation companion source: ' + JSON.stringify(source));
              for (const [key, value] of Object.entries(source))
                appendFileSync(process.env.GITHUB_ENV, `PERFCHECKER_DOCS_RENDERER_${key.toUpperCase()}=${value}\n`);
            }
          });
          NODE
      - name: Test documentation writer compatibility before rendering
        working-directory: ${{ steps.version.outputs.explicit-source == 'true' && 'stable-doc-source' || '.' }}
        env:
          EXPLICIT_DOC_SOURCE: ${{ steps.version.outputs.explicit-source }}
        run: |
          if [[ -f website/test_compat.jl ]]; then
            julia --startup-file=no --project=website website/test_compat.jl
          elif [[ "$EXPLICIT_DOC_SOURCE" == true && "$PERFCHECKER_DOCS_VERSION" == 1.0.0 ]]; then
            echo "Legacy explicit stable 1.0.0 snapshot predates the writer compatibility test."
          else
            echo "Missing required documentation writer compatibility test" >&2
            exit 1
          fi
      - name: Cache isolated PerfCheckerLinuxPerf dependencies
        if: steps.version.outputs.companion-apis == 'true'
        uses: julia-actions/cache@v3
        with:
          depot: ${{ runner.temp }}/optional-api/linuxperf-depot
          cache-name: optional-api-v1-linuxperf-${{ runner.arch }}-${{ steps.docs-julia.outputs.julia-version }}-${{ hashFiles('Project.toml', 'stable-doc-source/Project.toml', '**/website/optional-api/linuxperf/Project.toml', '**/packages/PerfCheckerLinuxPerf/Project.toml') }}
          save-always: true
      - name: Cache isolated PerfCheckerLIKWID dependencies
        if: steps.version.outputs.companion-apis == 'true'
        uses: julia-actions/cache@v3
        with:
          depot: ${{ runner.temp }}/optional-api/likwid-depot
          cache-name: optional-api-v1-likwid-${{ runner.arch }}-${{ steps.docs-julia.outputs.julia-version }}-${{ hashFiles('Project.toml', 'stable-doc-source/Project.toml', '**/website/optional-api/likwid/Project.toml', '**/packages/PerfCheckerLIKWID/Project.toml') }}
          save-always: true
      - name: Cache isolated PerfCheckerMakie dependencies
        if: steps.version.outputs.companion-apis == 'true'
        uses: julia-actions/cache@v3
        with:
          depot: ${{ runner.temp }}/optional-api/makie-depot
          cache-name: optional-api-v1-makie-${{ runner.arch }}-${{ steps.docs-julia.outputs.julia-version }}-${{ hashFiles('Project.toml', 'stable-doc-source/Project.toml', '**/website/optional-api/makie/Project.toml', '**/packages/PerfCheckerMakie/Project.toml') }}
          save-always: true
      - name: Cache isolated PerfCheckerWeb dependencies
        if: steps.version.outputs.companion-apis == 'true'
        uses: julia-actions/cache@v3
        with:
          depot: ${{ runner.temp }}/optional-api/web-depot
          cache-name: optional-api-v1-web-${{ runner.arch }}-${{ steps.docs-julia.outputs.julia-version }}-${{ hashFiles('Project.toml', 'stable-doc-source/Project.toml', '**/website/optional-api/web/Project.toml', '**/packages/PerfCheckerWeb/Project.toml') }}
          save-always: true
      - name: Cache isolated PerfCheckerPluto dependencies
        if: steps.version.outputs.companion-apis == 'true'
        uses: julia-actions/cache@v3
        with:
          depot: ${{ runner.temp }}/optional-api/pluto-depot
          cache-name: optional-api-v1-pluto-${{ runner.arch }}-${{ steps.docs-julia.outputs.julia-version }}-${{ hashFiles('Project.toml', 'stable-doc-source/Project.toml', '**/website/optional-api/pluto/Project.toml', '**/packages/PerfCheckerPluto/Project.toml') }}
          save-always: true
      - name: Cache isolated PerfCheckerTachikoma dependencies
        if: steps.version.outputs.companion-apis == 'true'
        uses: julia-actions/cache@v3
        with:
          depot: ${{ runner.temp }}/optional-api/tachikoma-depot
          cache-name: optional-api-v1-tachikoma-${{ runner.arch }}-${{ steps.docs-julia.outputs.julia-version }}-${{ hashFiles('Project.toml', 'stable-doc-source/Project.toml', '**/website/optional-api/tachikoma/Project.toml', '**/packages/PerfCheckerTachikoma/Project.toml', '**/packages/PerfCheckerMakie/Project.toml') }}
          save-always: true
      - name: Render companion APIs in isolated projects, once per source revision
        if: steps.version.outputs.companion-apis == 'true'
        working-directory: ${{ steps.version.outputs.explicit-source == 'true' && 'stable-doc-source' || '.' }}
        shell: bash
        run: |
          export PERFCHECKER_SOURCE="$PWD"
          for companion in linuxperf likwid makie web pluto tachikoma; do
            project="$RUNNER_TEMP/optional-api/$companion-project"
            mkdir -p "$project"
            cp "website/optional-api/$companion/Project.toml" "$project/Project.toml"
            export JULIA_DEPOT_PATH="$RUNNER_TEMP/optional-api/$companion-depot"
            export PERFCHECKER_COMPANION="$companion"
            julia --startup-file=no --project="$project" -e '
              using Pkg
              root = ENV["PERFCHECKER_SOURCE"]
              slug = ENV["PERFCHECKER_COMPANION"]
              owners = Dict("linuxperf"=>"PerfCheckerLinuxPerf", "likwid"=>"PerfCheckerLIKWID",
                "makie"=>"PerfCheckerMakie", "web"=>"PerfCheckerWeb",
                "pluto"=>"PerfCheckerPluto", "tachikoma"=>"PerfCheckerTachikoma")
              specs = [Pkg.PackageSpec(path=root),
                Pkg.PackageSpec(path=joinpath(root,"packages",owners[slug]))]
              slug == "tachikoma" && push!(specs,
                Pkg.PackageSpec(path=joinpath(root,"packages","PerfCheckerMakie")))
              Pkg.develop(specs); Pkg.instantiate()'
            julia --startup-file=no --project="$project" website/optional-api/make.jl "$companion"
          done
      - name: Test canonical assembly against the six real exports
        if: steps.version.outputs.companion-apis == 'true'
        working-directory: ${{ steps.version.outputs.explicit-source == 'true' && 'stable-doc-source' || '.' }}
        run: julia --startup-file=no --project=website website/optional-api/test_assembly.jl
      - name: Render every published plot from its saved native model
        if: steps.version.outputs.companion-apis == 'true'
        working-directory: ${{ steps.version.outputs.explicit-source == 'true' && 'stable-doc-source' || '.' }}
        shell: bash
        run: |
          export PERFCHECKER_SOURCE="$PWD"
          project="$RUNNER_TEMP/native-plot-project"
          mkdir -p "$project"
          cp website/optional-api/makie/Project.toml "$project/Project.toml"
          export JULIA_DEPOT_PATH="$RUNNER_TEMP/optional-api/makie-depot"
          julia --startup-file=no --project="$project" -e '
            using Pkg
            root = ENV["PERFCHECKER_SOURCE"]
            Pkg.develop([Pkg.PackageSpec(path=root),
              Pkg.PackageSpec(path=joinpath(root,"packages","PerfCheckerMakie"))])
            Pkg.add(["CairoMakie", "UnicodePlots", "JSON", "Statistics"])
            Pkg.instantiate()'
          julia --startup-file=no --project="$project" examples/kitchen-sink/publish-evidence.jl --interactive
          if [[ -f website/src/public/examples/jet-dispatch/render.jl ]]; then
            jet_output="$RUNNER_TEMP/jet-native-plot"
            julia --startup-file=no --project="$project" website/src/public/examples/jet-dispatch/render.jl \
              website/src/public/examples/jet-dispatch/summary.json "$jet_output"
            cp "$jet_output/measurements.json" "$jet_output/measurements.html" website/src/public/examples/jet-dispatch/
          fi
      - name: Preserve companion API provenance and isolated environment pairs
        if: always() && steps.version.outputs.companion-apis == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: documentation-optional-api-exports
          include-hidden-files: true
          path: |
            ${{ steps.version.outputs.explicit-source == 'true' && 'stable-doc-source/' || '' }}website/optional-api/build
            ${{ runner.temp }}/optional-api/*-project/Project.toml
            ${{ runner.temp }}/optional-api/*-project/Manifest.toml
            ${{ runner.temp }}/native-plot-project/Project.toml
            ${{ runner.temp }}/native-plot-project/Manifest.toml
          if-no-files-found: error
          retention-days: 14
      - name: Build the GitHub mirror
        if: steps.version.outputs.explicit-source != 'true'
        shell: bash
        env:
          PERFCHECKER_DOCS_HOSTING: github
          PERFCHECKER_DOCS_URL: https://mirage-interactive-fr.github.io/PerfChecker/
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            export PERFCHECKER_DOCS_BASE="/PerfChecker/$GITHUB_REF_NAME/"
            export PERFCHECKER_DOCS_CHANNEL=version
          else
            export PERFCHECKER_DOCS_BASE=/PerfChecker/dev/
            export PERFCHECKER_DOCS_CHANNEL=dev
          fi
          julia --startup-file=no --project=website website/make.jl
      - name: Build canonical development documentation
        if: steps.version.outputs.explicit-source != 'true'
        env:
          PERFCHECKER_DOCS_HOSTING: sftp
          PERFCHECKER_DOCS_CHANNEL: dev
          PERFCHECKER_DOCS_BASE: /dev/
          PERFCHECKER_DOCS_URL: https://perfchecker.mirageinteractive.fr/dev/
          PERFCHECKER_DOCS_BUILD_DIR: build/sftp/dev
        run: julia --startup-file=no --project=website website/make.jl
      - name: Build canonical version and stable exports
        if: steps.version.outputs.explicit-source != 'true' && (github.ref_type == 'tag' || github.event_name == 'pull_request' || inputs.publication == 'stable')
        shell: bash
        env:
          PERFCHECKER_DOCS_HOSTING: sftp
        run: |
          PERFCHECKER_DOCS_CHANNEL=version \
          PERFCHECKER_DOCS_BASE="/v$PERFCHECKER_DOCS_VERSION/" \
          PERFCHECKER_DOCS_URL="https://perfchecker.mirageinteractive.fr/v$PERFCHECKER_DOCS_VERSION/" \
          PERFCHECKER_DOCS_BUILD_DIR=build/sftp/version \
          julia --startup-file=no --project=website website/make.jl
          PERFCHECKER_DOCS_CHANNEL=stable \
          PERFCHECKER_DOCS_BASE=/ \
          PERFCHECKER_DOCS_URL=https://perfchecker.mirageinteractive.fr/ \
          PERFCHECKER_DOCS_BUILD_DIR=build/sftp/stable \
          julia --startup-file=no --project=website website/make.jl
      - name: Build only the explicit stable root export
        if: steps.version.outputs.explicit-source == 'true'
        working-directory: stable-doc-source
        env:
          PERFCHECKER_DOCS_HOSTING: sftp
          PERFCHECKER_DOCS_CHANNEL: stable
          PERFCHECKER_DOCS_BASE: /
          PERFCHECKER_DOCS_URL: https://perfchecker.mirageinteractive.fr/
          PERFCHECKER_DOCS_BUILD_DIR: build/sftp/stable
        run: julia --startup-file=no --project=website website/make.jl
      - name: Install the browser checker
        working-directory: qualification
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check canonical HTML, search, assets and version metadata
        if: steps.version.outputs.explicit-source != 'true'
        run: node qualification/shared/canonical-documentation.mjs website/build/sftp --browser
      - name: Check the explicit stable root HTML, search, assets and version metadata
        if: steps.version.outputs.explicit-source == 'true'
        working-directory: stable-doc-source
        run: node "$GITHUB_WORKSPACE/qualification/shared/canonical-documentation.mjs" website/build/sftp --browser
      - name: Preserve built site and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-browser-diagnostics
          path: |
            ${{ steps.version.outputs.explicit-source == 'true' && 'stable-doc-source/' || '' }}website/build/browser-diagnostics
            ${{ steps.version.outputs.explicit-source == 'true' && 'stable-doc-source/' || '' }}website/build/sftp
            !${{ steps.version.outputs.explicit-source == 'true' && 'stable-doc-source/' || '' }}website/build/sftp/**/.documenter
          if-no-files-found: warn
          retention-days: 14
      - name: Save canonical exports before any transfer
        uses: actions/upload-artifact@v7
        with:
          name: documentation-sftp-exports
          path: |
            ${{ steps.version.outputs.explicit-source == 'true' && 'stable-doc-source/' || '' }}website/build/sftp
            !${{ steps.version.outputs.explicit-source == 'true' && 'stable-doc-source/' || '' }}website/build/sftp/**/.documenter
          if-no-files-found: error
          retention-days: 14
      - name: Save the GitHub mirror export
        if: steps.version.outputs.explicit-source != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: documentation-github-export
          path: website/build/site
          if-no-files-found: error
          retention-days: 14
      - name: Publish the development GitHub mirror
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          steps.version.outputs.explicit-source != 'true' &&
          vars.PERFCHECKER_DOCS_DEPLOY == 'true'
        run: julia --startup-file=no --project=website website/deploy.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}

  sftp:
    name: Publish canonical documentation through SFTP
    needs: documentation
    if: >-
      github.event.deleted != true &&
      vars.PERFCHECKER_DOCS_SFTP_DEPLOY_V2 == 'true' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    # The earlier v1.1.1 root copy was incomplete at the three-hour job limit.
    # Allow its automatic dev copy and explicit stable refresh bounded room.
    timeout-minutes: ${{ github.ref == 'refs/heads/main' && needs.documentation.outputs['stable-version'] == 'v1.1.1' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publication == 'stable' && inputs.stable_version == 'v1.1.1')) && 360 || 120 }}
    environment: documentation-sftp
    # All refs share one publisher; the server-side lock also protects manual clients.
    concurrency:
      group: perfchecker-documentation-sftp
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check out the same explicit documentation source for publication validation
        if: needs.documentation.outputs.explicit-source == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.documentation.outputs.source-revision }}
          path: stable-doc-source
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: documentation-sftp-exports
          path: website/build/sftp
      - name: Install the pinned SFTP transport
        working-directory: website
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch the immutable Core and renderer tags for a stable refresh
        if: github.event_name == 'workflow_dispatch' && inputs.publication == 'stable'
        env:
          STABLE_VERSION: ${{ needs.documentation.outputs.stable-version }}
          SOURCE_REVISION: ${{ needs.documentation.outputs.source-revision }}
          SOURCE_REPOSITORY: ${{ needs.documentation.outputs.explicit-source == 'true' && 'stable-doc-source' || '.' }}
        run: |
          git -C "$SOURCE_REPOSITORY" fetch --no-tags --depth=1 origin "refs/tags/$STABLE_VERSION:refs/tags/$STABLE_VERSION"
          node --input-type=module -e 'import {fetchStableDocumentationCompanions} from "./website/deploy-sftp.mjs"; await fetchStableDocumentationCompanions(process.env.SOURCE_REPOSITORY, process.env.STABLE_VERSION, process.env.SOURCE_REVISION);'
      - name: Publish the completed exports
        env:
          PERFCHECKER_DOCS_STABLE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.publication == 'stable' }}
          PERFCHECKER_DOCS_STABLE_VERSION: ${{ needs.documentation.outputs.stable-version }}
          PERFCHECKER_DOCS_SOURCE_VERSION: ${{ inputs.stable_version }}
          PERFCHECKER_DOCS_SOURCE_REVISION: ${{ needs.documentation.outputs.explicit-source == 'true' && needs.documentation.outputs.source-revision || '' }}
          PERFCHECKER_DOCS_SOURCE_REPOSITORY: stable-doc-source
          PERFCHECKER_DOCS_REF_DELETED: ${{ github.event.deleted }}
          PERFCHECKER_DOCS_SFTP_DEPLOY: ${{ vars.PERFCHECKER_DOCS_SFTP_DEPLOY_V2 }}
          PERFCHECKER_DOCS_SFTP_HOST: ${{ vars.PERFCHECKER_DOCS_SFTP_HOST }}
          PERFCHECKER_DOCS_SFTP_PORT: ${{ vars.PERFCHECKER_DOCS_SFTP_PORT }}
          PERFCHECKER_DOCS_SFTP_USER: ${{ vars.PERFCHECKER_DOCS_SFTP_USER }}
          PERFCHECKER_DOCS_SFTP_ROOT: ${{ vars.PERFCHECKER_DOCS_SFTP_ROOT }}
          PERFCHECKER_DOCS_SFTP_PASSWORD: ${{ secrets.PERFCHECKER_DOCS_SFTP_PASSWORD }}
          PERFCHECKER_DOCS_SFTP_KNOWN_HOSTS: ${{ secrets.PERFCHECKER_DOCS_SFTP_KNOWN_HOSTS }}
          PERFCHECKER_DOCS_SFTP_SSH_KEY: ${{ secrets.PERFCHECKER_DOCS_SFTP_SSH_KEY }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            export PERFCHECKER_DOCS_SITE=website/build/sftp/version/site
            export PERFCHECKER_DOCS_STABLE_SITE=website/build/sftp/stable/site
          elif [[ "$PERFCHECKER_DOCS_STABLE_REFRESH" == true ]]; then
            export PERFCHECKER_DOCS_SITE=website/build/sftp/stable/site
          else
            export PERFCHECKER_DOCS_SITE=website/build/sftp/dev/site
          fi
          node website/deploy-sftp.mjs

  publish-reviewed:
    name: Publish reviewed local export — no build or tests
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.publication == 'stable' && inputs.reviewed_export_asset != '' &&
      vars.PERFCHECKER_DOCS_SFTP_DEPLOY_V2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: documentation-sftp
    concurrency:
      group: perfchecker-documentation-sftp
      cancel-in-progress: false
    env:
      PERFCHECKER_DOCS_STABLE_REFRESH: 'true'
      PERFCHECKER_DOCS_STABLE_VERSION: ${{ inputs.stable_version }}
      PERFCHECKER_DOCS_SOURCE_VERSION: ${{ inputs.stable_version }}
      PERFCHECKER_DOCS_SOURCE_REVISION: ${{ inputs.docs_source_revision }}
      PERFCHECKER_DOCS_SOURCE_REPOSITORY: stable-doc-source
      REVIEWED_EXPORT_ASSET: ${{ inputs.reviewed_export_asset }}
      REVIEWED_EXPORT_SHA256: ${{ inputs.reviewed_export_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install only the pinned publication transport
        working-directory: website
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate the explicit stable publication inputs
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {documentationSourceConfiguration} from './website/deploy-sftp.mjs';
          assert(documentationSourceConfiguration(process.env).explicit);
          assert(/^[1-9][0-9]*$/.test(process.env.REVIEWED_EXPORT_ASSET));
          assert(/^[0-9a-f]{64}$/.test(process.env.REVIEWED_EXPORT_SHA256));
          NODE
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.docs_source_revision }}
          path: stable-doc-source
          persist-credentials: false
      - name: Verify the immutable Core and renderer sources
        run: |
          git -C stable-doc-source fetch --no-tags --depth=1 origin "refs/tags/$PERFCHECKER_DOCS_STABLE_VERSION:refs/tags/$PERFCHECKER_DOCS_STABLE_VERSION"
          node --input-type=module <<'NODE'
          import {fetchStableDocumentationCompanions, validateStableDocumentationSource} from './website/deploy-sftp.mjs';
          const env = process.env;
          await fetchStableDocumentationCompanions('stable-doc-source', env.PERFCHECKER_DOCS_STABLE_VERSION, env.PERFCHECKER_DOCS_SOURCE_REVISION);
          await validateStableDocumentationSource('stable-doc-source', env.PERFCHECKER_DOCS_STABLE_VERSION, env.PERFCHECKER_DOCS_SOURCE_REVISION);
          NODE
      - name: Retrieve only the exact reviewed stable export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {createReadStream} from 'node:fs';
          import {mkdir, stat} from 'node:fs/promises';
          import {join} from 'node:path';
          const env = process.env, revision = env.PERFCHECKER_DOCS_SOURCE_REVISION;
          const version = env.PERFCHECKER_DOCS_STABLE_VERSION;
          const name = `documentation-stable-${revision}.zip`;
          const release = JSON.parse(execFileSync('gh', ['api', `repos/${env.GITHUB_REPOSITORY}/releases/tags/${version}`], {encoding: 'utf8'}));
          assert.equal(release.tag_name, version); assert.equal(release.draft, false);
          const asset = release.assets.find(asset => String(asset.id) === env.REVIEWED_EXPORT_ASSET);
          assert(asset && asset.name === name && asset.size > 0 && asset.size < 2 * 1024 ** 3);
          if (asset.digest) assert.equal(asset.digest, `sha256:${env.REVIEWED_EXPORT_SHA256}`);
          const download = join(env.RUNNER_TEMP, 'reviewed-documentation');
          await mkdir(download);
          execFileSync('gh', ['release', 'download', version, '--repo', env.GITHUB_REPOSITORY, '--pattern', name, '--dir', download], {stdio: 'inherit', timeout: 1200000});
          const archive = join(download, name), hash = createHash('sha256');
          assert.equal((await stat(archive)).size, asset.size);
          for await (const chunk of createReadStream(archive)) hash.update(chunk);
          assert.equal(hash.digest('hex'), env.REVIEWED_EXPORT_SHA256);
          const paths = execFileSync('unzip', ['-Z1', archive], {encoding: 'utf8', maxBuffer: 4 * 1024 ** 2}).trim().split('\n');
          assert(paths.length > 0 && new Set(paths).size === paths.length);
          assert(paths.every(path => path.startsWith('stable/site/') && !path.includes('\\') && !path.split('/').includes('..')));
          await mkdir('website/build/sftp', {recursive: true});
          execFileSync('unzip', ['-q', archive, '-d', 'website/build/sftp'], {stdio: 'inherit'});
          console.log(`Reviewed export verified: asset=${asset.id}, bytes=${asset.size}, revision=${revision}, sha256=${env.REVIEWED_EXPORT_SHA256}`);
          NODE
      - name: Publish the reviewed stable export, preserving the version archive
        env:
          PERFCHECKER_DOCS_SITE: website/build/sftp/stable/site
          PERFCHECKER_DOCS_SFTP_DEPLOY: ${{ vars.PERFCHECKER_DOCS_SFTP_DEPLOY_V2 }}
          PERFCHECKER_DOCS_SFTP_HOST: ${{ vars.PERFCHECKER_DOCS_SFTP_HOST }}
          PERFCHECKER_DOCS_SFTP_PORT: ${{ vars.PERFCHECKER_DOCS_SFTP_PORT }}
          PERFCHECKER_DOCS_SFTP_USER: ${{ vars.PERFCHECKER_DOCS_SFTP_USER }}
          PERFCHECKER_DOCS_SFTP_ROOT: ${{ vars.PERFCHECKER_DOCS_SFTP_ROOT }}
          PERFCHECKER_DOCS_SFTP_PASSWORD: ${{ secrets.PERFCHECKER_DOCS_SFTP_PASSWORD }}
          PERFCHECKER_DOCS_SFTP_KNOWN_HOSTS: ${{ secrets.PERFCHECKER_DOCS_SFTP_KNOWN_HOSTS }}
          PERFCHECKER_DOCS_SFTP_SSH_KEY: ${{ secrets.PERFCHECKER_DOCS_SFTP_SSH_KEY }}
        run: node website/deploy-sftp.mjs

  recover-111:
    name: Recover the retained v1.1.1 documentation exports
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.publication == 'recover-1.1.1' || inputs.publication == 'recover-1.1.1-after-3h') &&
      github.ref == 'refs/heads/main' && vars.PERFCHECKER_DOCS_SFTP_DEPLOY_V2 == 'true'
    runs-on: ubuntu-latest
    # Keep the original route unchanged. Its one reviewed 3h cancellation needs
    # a separate bounded budget; neither route repeats the version archive.
    timeout-minutes: ${{ inputs.publication == 'recover-1.1.1-after-3h' && 360 || 180 }}
    environment: documentation-sftp
    permissions:
      contents: read
      actions: read
      checks: read
    concurrency:
      group: perfchecker-documentation-sftp
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PERFCHECKER_DOCS_RECOVERY: ${{ inputs.publication }}
      PERFCHECKER_DOCS_SOURCE_VERSION: ${{ inputs.stable_version }}
      PERFCHECKER_DOCS_SOURCE_REVISION: ${{ inputs.docs_source_revision }}
      PERFCHECKER_RECOVERY_RECLAIM_LOCK: ${{ inputs.reclaim_cancelled_lock }}
      PERFCHECKER_RECOVERY_RECLAIM_AFTER3H_LOCK: ${{ inputs.reclaim_3h_recovery_lock }}
      PERFCHECKER_DOCS_SFTP_DEPLOY: ${{ vars.PERFCHECKER_DOCS_SFTP_DEPLOY_V2 }}
      PERFCHECKER_DOCS_SFTP_HOST: ${{ vars.PERFCHECKER_DOCS_SFTP_HOST }}
      PERFCHECKER_DOCS_SFTP_PORT: ${{ vars.PERFCHECKER_DOCS_SFTP_PORT }}
      PERFCHECKER_DOCS_SFTP_USER: ${{ vars.PERFCHECKER_DOCS_SFTP_USER }}
      PERFCHECKER_DOCS_SFTP_ROOT: ${{ vars.PERFCHECKER_DOCS_SFTP_ROOT }}
      PERFCHECKER_DOCS_SFTP_PASSWORD: ${{ secrets.PERFCHECKER_DOCS_SFTP_PASSWORD }}
      PERFCHECKER_DOCS_SFTP_KNOWN_HOSTS: ${{ secrets.PERFCHECKER_DOCS_SFTP_KNOWN_HOSTS }}
      PERFCHECKER_DOCS_SFTP_SSH_KEY: ${{ secrets.PERFCHECKER_DOCS_SFTP_SSH_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install the pinned SFTP transport without building documentation
        working-directory: website
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify original producer, cancelled publisher, tag and retained ZIP bytes
        run: node website/deploy-sftp.mjs recovery-download
      - name: Inspect the original archive marker and cancelled lock without remote writes
        id: inspect
        run: node website/deploy-sftp.mjs recovery-inspect
      - name: Save verification and lock receipt before allowing any lock removal
        id: receipt
        uses: actions/upload-artifact@v7
        with:
          name: documentation-recovery-111-inspection
          include-hidden-files: true
          path: |
            .recovery/verified-origin.json
            .recovery/inspection.json
          if-no-files-found: error
          retention-days: 14
      - name: Recheck the saved receipt and resume only the stable copy and final markers
        env:
          PERFCHECKER_RECOVERY_PLAN_SHA256: ${{ steps.inspect.outputs.plan-sha256 }}
          PERFCHECKER_RECOVERY_PLAN_ARTIFACT: ${{ steps.receipt.outputs.artifact-id }}
          PERFCHECKER_RECOVERY_PLAN_ARTIFACT_SHA256: ${{ steps.receipt.outputs.artifact-digest }}
        run: node website/deploy-sftp.mjs recovery-apply
      - name: Preserve recovery receipts even when a later transfer fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-recovery-111-result
          include-hidden-files: true
          path: |
            .recovery/verified-origin.json
            .recovery/inspection.json
            .recovery/result.json
          if-no-files-found: warn
          retention-days: 14
