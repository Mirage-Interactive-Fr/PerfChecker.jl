name: CompatHelper
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - name: Check if Julia is already available in the PATH
        id: julia_in_path
        run: which julia
        continue-on-error: true
      - name: Install Julia, but only if it is not already available in the PATH
        uses: julia-actions/setup-julia@v3
        with:
          version: "1"
          arch: ${{ runner.arch }}
        if: steps.julia_in_path.outcome != 'success'
      - name: "Add the General registry via Git"
        run: |
          import Pkg
          ENV["JULIA_PKG_SERVER"] = ""
          Pkg.Registry.add("General")
        shell: julia --color=yes {0}
      - name: "Install CompatHelper"
        run: |
          import Pkg
          name = "CompatHelper"
          uuid = "aa819f21-2bde-4658-8897-bab36330d9b7"
          version = "3"
          Pkg.add(; name, uuid, version)
        shell: julia --color=yes {0}
      - name: "Run CompatHelper"
        run: |
          isempty(get(ENV, "COMPATHELPER_PRIV", "")) && error("Configure the writable TAGBOT_SSH_KEY repository secret before running CompatHelper")
          import CompatHelper
          # CompatHelper can propose adding "1", which would reopen the known
          # BenchmarkTools 1.8.0 Int32 defect. The required CI exclusion check
          # rejects that proposal; review it instead of auto-merging it.
          CompatHelper.main(; subdirs=["", "website", "qualification", "packages/PerfCheckerWeb", "packages/PerfCheckerPluto", "packages/PerfCheckerMakie", "providers/JET", "providers/AllocCheck", "providers/SnoopCompile", "providers/Aqua"])
        shell: julia --color=yes {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Reuse the writable repository deploy key so proposed updates trigger CI.
          COMPATHELPER_PRIV: ${{ secrets.TAGBOT_SSH_KEY }}
