<style>

@media(max-width:600px){body{padding:10px}.toolbar{gap:6px}.toolbar label{font-size:12px}.spacer{display:none}.plot-scroll{height:480px}.controls{gap:6px}.controls label{font-size:12px;padding:6px 8px}}
</style></head><body><main class="app">
<div class="brand">PerfChecker.jl · SAVED MEASUREMENTS</div><h1 id="title"></h1><p id="tags"></p>

<button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-level" aria-live="polite">100%</span><button id="zoom-in" aria-label="Zoom in">+</button>
<button id="fit">Fit</button>
<button id="export-svg">Export SVG</button><button id="export-csv">Data CSV</button>
</div>
<div class="controls" id="controls" aria-label="Visible measurements"></div>
<div class="scroll plot-scroll" tabindex="0" aria-label="Plot viewport. Drag to pan; use plus and minus to zoom, or zero to reset zoom."><svg viewBox="0 0 900 470" role="group" aria-label="Overlaid normalized measurements" xmlns="http://www.w3.org/2000/svg"></svg></div>

</main><script>
const plot={"collector_label":"BenchmarkTools","colors":{"julia.alloc.bytes":"#0f766e","julia.alloc.count":"#7e22ce","julia.gc.time":"#c2410c","julia.wall.time":"#2563eb"},"data":[{"capture_id":"704f1795-1640-4773-b837-c8bea64edd74","derivation":"minimum of recorded paired BenchmarkTools samples","metric":"julia.wall.time","normalization_status":"ratio","ratio":1.0,"reference_value":0.000502955,"reference_version":"dynamic","samples":20,"statistic":"minimum","target_kind":"implementation","unit":"s","value":0.000502955,"version":"dynamic"},{"capture_id":"70fcbd49-d369-40da-a32b-d577e088e646","derivation":"minimum of recorded paired BenchmarkTools samples","metric":"julia.wall.time","normalization_status":"ratio","ratio":0.003666331978009961,"reference_value":0.000502955,"reference_version":"dynamic","samples":20,"statistic":"minimum","target_kind":"implementation","unit":"s","value":1.844e-6,"version":"typed"},{"capture_id":"704f1795-1640-4773-b837-c8bea64edd74","derivation":"minimum of recorded paired BenchmarkTools samples","metric":"julia.gc.time","normalization_status":"both_zero","ratio":1.0,"reference_value":0,"reference_version":"dynamic","samples":20,"statistic":"minimum","target_kind":"implementation","unit":"s","value":0,"version":"dynamic"},{"capture_id":"70fcbd49-d369-40da-a32b-d577e088e646","derivation":"minimum of recorded paired BenchmarkTools samples","metric":"julia.gc.time","normalization_status":"both_zero","ratio":1.0,"reference_value":0,"reference_version":"dynamic","samples":20,"statistic":"minimum","target_kind":"implementation","unit":"s","value":0,"version":"typed"},{"capture_id":"704f1795-1640-4773-b837-c8bea64edd74","derivation":"minimum of recorded paired BenchmarkTools samples","metric":"julia.alloc.bytes","normalization_status":"ratio","ratio":1.0,"reference_value":720896,"reference_version":"dynamic","samples":20,"statistic":"minimum","target_kind":"implementation","unit":"By","value":720896,"version":"dynamic"},{"capture_id":"70fcbd49-d369-40da-a32b-d577e088e646","derivation":"minimum of recorded paired BenchmarkTools samples","metric":"julia.alloc.bytes","normalization_status":"ratio","ratio":0.0,"reference_value":720896,"reference_version":"dynamic","samples":20,"statistic":"minimum","target_kind":"implementation","unit":"By","value":0,"version":"typed"},{"capture_id":"704f1795-1640-4773-b837-c8bea64edd74","derivation":"minimum of recorded paired BenchmarkTools samples","metric":"julia.alloc.count","normalization_status":"ratio","ratio":1.0,"reference_value":32768,"reference_version":"dynamic","samples":20,"statistic":"minimum","target_kind":"implementation","unit":"1","value":32768,"version":"dynamic"},{"capture_id":"70fcbd49-d369-40da-a32b-d577e088e646","derivation":"minimum of recorded paired BenchmarkTools samples","metric":"julia.alloc.count","normalization_status":"ratio","ratio":0.0,"reference_value":32768,"reference_version":"dynamic","samples":20,"statistic":"minimum","target_kind":"implementation","unit":"1","value":0,"version":"typed"}],"description":"one warm operation on fresh prepared state; preparation and correctness verification excluded; 20 samples, evals=1, sequential implementations; two implementations on one local machine; not released package versions or a portable speed guarantee; minimum per recorded target / dynamic reference for each metric. Targets retain their recorded identity.","encoding":{"color":"metric","x":"version","y":"ratio"},"id":"measurements","kind":"normalized_metrics","options":{"collector":"BenchmarkTools (through PerfChecker)","metadata":{"allocation_scope":"BenchmarkTools Trial.memory and Trial.allocs per-evaluation estimates; paired times and GC times are the actual native samples","capture_ids":["704f1795-1640-4773-b837-c8bea64edd74","70fcbd49-d369-40da-a32b-d577e088e646"],"case_source_sha256":"5fa164e34f2a284e285a9ecd9a613bc6bad4b4288e179a5666634436ddda5d10","collector_versions":["1.7.0","1.7.0"],"evidence_file":"normalized-source.json","expected_result":129536,"finished_at":"2026-10-13T06:02:39.130","manifest_sha256":"143e43074e9da1fefd48ec10d2e8ebbd7c0f012946f428b6fd8c39caeb170c07","measurement_entrypoint":"PerfChecker SharedScenarioRuntime.measure_benchmark(case, 20; raw=true)","measurement_runtime_sha256":"6f3e6aaa5dddb2be0b53361b7f354b608710224d51bb68d4dc3b541a2e8657eb","original_source_sha256":"c6d0568700487bb9553912666f0b65d513ed3071724738c6de683653ecd313c3","original_summary_sha256":"a63ecb4dade6550034e6faad2be413d0859fd13cf21fbbd44a63b5aaa14b810b","perfchecker_tree":"753e41cad1c984640a2337b314b70ad6932626ad","perfchecker_version":"1.1.0","project_sha256":"fdc5dbd143c6f0657210c4f982ef88cf5d60485f119e18c876977da40d338153","projection":"Recorded metric minima; reference=dynamic for each metric","rows":4096,"runner_sha256":"221687c9fd98a8f32c2157fd53efd694355ae223361e71f22e6ee571b02f34c1","runtime":{"arch":"x86_64","language":"julia","os":"Linux","threads":1,"version":"1.13.1"},"scope":"one warm operation on fresh prepared state; preparation and correctness verification excluded; 20 samples, evals=1, sequential implementations; two implementations on one local machine; not released package versions or a portable speed guarantee","source_sha256":{"normalized-source.json":"c0816e9b078fe34005ee520203c240e3cda33876a675d0556289ea9311dc4899","summary.json":"a63ecb4dade6550034e6faad2be413d0859fd13cf21fbbd44a63b5aaa14b810b"},"started_at":"2026-10-13T06:02:36.614","target_kind":"implementation","units":{"allocs":"1","bytes":"By","gctime":"s","time":"s"}},"reference_version":"dynamic","statistic":"minimum","target_label":"implementation","unit":"ratio","versions":["dynamic","typed"],"xlabel":"Implementation","zero_reference_policy":"equal zeros = 1 (unchanged); nonzero / zero = unavailable"},"schema_version":"perfchecker-plot/1","title":"Same revenue calculation, different element types"};
const svg=document.querySelector('svg'),ns='http://www.w3.org/2000/svg',viewport=document.querySelector('.plot-scroll');
const metrics=[...new Set(plot.data.map(row=>row.metric))],hidden=new Set(),versions=plot.options.versions;
const from=document.querySelector('#version-from'),to=document.querySelector('#version-to'),readout=document.querySelector('#readout');
const xlabel=plot.options.xlabel??'Package version',targetLabel=plot.options.target_label??'version';
if(plot.options.target_label!==undefined){
 document.querySelector('#target-controls').setAttribute('aria-label','Compare recorded '+targetLabel+' targets');
 from.setAttribute('aria-label','First recorded '+targetLabel);to.setAttribute('aria-label','Last recorded '+targetLabel);
 document.querySelector('#target-heading').textContent=targetLabel.charAt(0).toUpperCase()+targetLabel.slice(1);
}
let inspectedMetric=null,zoom=1;
const textContext=document.createElement('canvas').getContext('2d');textContext.font='12px system-ui';
const plotWidth=()=>Math.max(160,viewport.clientWidth-2);
function wrapText(text,width){const lines=[];let line='';for(const char of text){if(line&&textContext.measureText(line+char).width>width){lines.push(line);line=''}line+=char}if(line)lines.push(line);return lines}
const element=(name,attrs,text)=>{const node=document.createElementNS(ns,name);for(const [key,value]of Object.entries(attrs))node.setAttribute(key,value);if(text!==undefined)node.textContent=text;return node};
const label=row=>row.version+' · '+row.metric+': '+row.value+' '+row.unit+' · ratio '+(row.ratio??'unavailable')+' · '+row.normalization_status;
const clearReadout=()=>{inspectedMetric=null;readout.textContent='Hover or focus a visible point to read its value.'};
const selectedVersions=()=>versions.slice(Number(from.value),Number(to.value)+1);
const selectedRows=()=>plot.data.filter(row=>selectedVersions().includes(row.version));
document.querySelector('#title').textContent=plot.title+' · '+plot.collector_label;
document.querySelector('#tags').textContent='Tags: '+((plot.options.tags||[]).join(', ')||'none');
const description=plot.description+' Selecting '+(plot.options.target_label===undefined?'versions':targetLabel+' targets')+' preserves the original reference and recorded ratios.';
document.querySelector('#description').textContent=description;
for(const [index,version]of versions.entries())for(const select of [from,to])select.add(new Option(version,String(index)));
from.value='0';to.value=String(Math.max(0,versions.length-1));
for(const select of [from,to])select.addEventListener('change',()=>{if(Number(from.value)>Number(to.value)){if(select===from)to.value=from.value;else from.value=to.value}clearReadout();draw()});
for(const metric of metrics){const l=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=true;
 input.addEventListener('change',()=>{input.checked?hidden.delete(metric):hidden.add(metric);if(hidden.has(inspectedMetric))clearReadout();draw()});
 l.append(input,metric.replace('julia.',''));l.style.color=plot.colors[metric];document.querySelector('#controls').append(l)}
function sizePlot(){const width=plotWidth();svg.setAttribute('viewBox','0 0 '+width+' 470');svg.style.width=width*zoom+'px';svg.style.height=470*zoom+'px';document.querySelector('#zoom-level').textContent=Math.round(zoom*100)+'%'}
function zoomTo(value){const old=zoom;zoom=Math.min(6,Math.max(1,value));sizePlot();viewport.scrollLeft=(viewport.scrollLeft+viewport.clientWidth/2)*zoom/old-viewport.clientWidth/2}
document.querySelector('#zoom-in').onclick=()=>zoomTo(zoom*1.5);document.querySelector('#zoom-out').onclick=()=>zoomTo(zoom/1.5);
document.querySelector('#fit').onclick=()=>{zoomTo(1);viewport.scrollTo(0,0)};
document.querySelector('#reset').onclick=()=>{from.value='0';to.value=String(Math.max(0,versions.length-1));hidden.clear();document.querySelectorAll('#controls input').forEach(input=>input.checked=true);zoom=1;viewport.scrollTo(0,0);clearReadout();draw()};
viewport.addEventListener('keydown',event=>{if(['+','=','-','0'].includes(event.key)){event.preventDefault();event.key==='0'?zoomTo(1):zoomTo(zoom*(event.key==='-'?1/1.5:1.5))}});
let drag;
viewport.addEventListener('pointerdown',event=>{if(event.pointerType!=='mouse'||event.button!==0||event.target.closest('circle'))return;drag={x:event.clientX,y:event.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};viewport.setPointerCapture(event.pointerId);viewport.classList.add('dragging')});
viewport.addEventListener('pointermove',event=>{if(drag){viewport.scrollLeft=drag.left+drag.x-event.clientX;viewport.scrollTop=drag.top+drag.y-event.clientY}});
const endDrag=()=>{drag=null;viewport.classList.remove('dragging')};viewport.addEventListener('pointerup',endDrag);viewport.addEventListener('pointercancel',endDrag);
new ResizeObserver(draw).observe(viewport);
function draw(){
 svg.replaceChildren();const visibleVersions=selectedVersions(),rows=selectedRows();
 const max=Math.max(1,...rows.filter(row=>!hidden.has(row.metric)).map(row=>row.ratio??0))*1.15;
 const width=plotWidth(),ticks=[0,1,max],tickLabel=tick=>tick.toFixed(tick>1?1:0)+'×';
 const left=Math.max(42,...ticks.map(tick=>textContext.measureText(tickLabel(tick)).width+12)),right=width-18;
 const annotation=plot.options.statistic+' per '+targetLabel+' / '+plot.options.reference_version+' reference for each metric';
 const lines=wrapText(annotation,right-left),top=Math.max(65,lines.length*16+20);
 const x=version=>visibleVersions.length===1?(left+right)/2:left+visibleVersions.indexOf(version)*(right-left)/(visibleVersions.length-1),y=ratio=>330-ratio/max*(330-top);
 for(const tick of ticks)svg.append(element('line',{x1:left,x2:right,y1:y(tick),y2:y(tick),stroke:'#d5ddeb','stroke-dasharray':tick===1?'5 4':'1 0'}),element('text',{x:left-12,y:y(tick)+4,'text-anchor':'end'},tickLabel(tick)));
 const note=element('text',{'aria-label':annotation});lines.forEach((line,index)=>note.append(element('tspan',{x:left,y:20+index*16},line)));svg.append(note);
 for(const metric of metrics){if(hidden.has(metric))continue;const series=rows.filter(row=>row.metric===metric);let d='',connected=false;
  for(const row of series){if(row.ratio===null){connected=false;continue}d+=(connected?' L':' M')+x(row.version)+','+y(row.ratio);connected=true}
  svg.append(element('path',{d,fill:'none',stroke:plot.colors[metric],'stroke-width':2.5}));
  for(const row of series){if(row.ratio===null)continue;const dot=element('circle',{cx:x(row.version),cy:y(row.ratio),r:4.5,fill:plot.colors[metric],stroke:'white','stroke-width':1.5,tabindex:0,'aria-label':label(row)});
   dot.append(element('title',{},label(row)));for(const event of ['mouseenter','focus','click'])dot.addEventListener(event,()=>{inspectedMetric=row.metric;readout.textContent=label(row)});svg.append(dot)}}
 const stride=Math.max(1,Math.ceil(visibleVersions.length*16/(right-left)));
 for(const [index,version]of visibleVersions.entries()){if(index!==visibleVersions.length-1&&(index%stride||visibleVersions.length-1-index<stride))continue;const tick=element('text',{x:x(version),y:344,'text-anchor':'start',transform:'rotate(90 '+x(version)+' 344)','aria-label':version},version.length>16?version.slice(0,12)+'…':version);tick.append(element('title',{},version));svg.append(tick)}
 document.querySelector('#description').textContent=description+(stride>1?' Some axis labels are omitted at this width. Focus a point or select its '+targetLabel+' to read its complete identity.':'');
 svg.append(element('text',{x:(left+right)/2,y:464,'text-anchor':'middle'},xlabel));
 const tbody=document.querySelector('tbody');tbody.replaceChildren();for(const row of rows){const tr=document.createElement('tr');for(const value of [row.metric,row.version,row.value,row.unit,row.ratio??'unavailable',row.normalization_status]){const td=document.createElement('td');td.textContent=value;tr.append(td)}tbody.append(tr)}sizePlot();
}
function download(content,type,name){const url=URL.createObjectURL(new Blob([content],{type})),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelector('#export-svg').onclick=()=>{
 const copy=svg.cloneNode(true),heading=document.querySelector('#title').textContent;
 const width=svg.viewBox.baseVal.width;const context=document.createElement('canvas').getContext('2d');context.font='600 14px system-ui';
 const lines=[];let line='';for(const char of heading){if(context.measureText(line+char).width>width-40){lines.push(line);line=''}line+=char}if(line)lines.push(line);
 const headerHeight=lines.length*20+16,group=element('g',{transform:'translate(0 '+headerHeight+')'});
 while(copy.firstChild)group.append(copy.firstChild);copy.append(group);copy.setAttribute('viewBox','0 0 '+width+' '+(470+headerHeight));copy.style.width=width+'px';copy.style.height=(470+headerHeight)+'px';
 copy.prepend(element('style',{},'text{fill:#526078;font:12px system-ui,sans-serif}'),element('title',{},heading));
 lines.forEach((text,index)=>copy.append(element('text',{x:20,y:22+index*20,style:'font-size:14px;font-weight:600'},text)));
 download(new XMLSerializer().serializeToString(copy),'image/svg+xml','perfchecker-normalized.svg')
};
document.querySelector('#export-csv').onclick=()=>{const fields=['metric','version','value','unit','ratio','normalization_status'],quote=value=>'"'+String(value??'').replaceAll('"','""')+'"';download([fields.join(','),...selectedRows().map(row=>fields.map(field=>quote(row[field])).join(','))].join('\n'),'text/csv','perfchecker-recorded-values.csv')};
draw();
</script></body></html>
