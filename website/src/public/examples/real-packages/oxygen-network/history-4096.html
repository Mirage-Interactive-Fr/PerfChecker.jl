    const finite=indices.filter(index=>rows[index].value!==null),left=74,right=width-25,top=42,bottom=265;
    const categories=panel.categories||[],numeric=panel.xkind==='numeric',log=panel.yscale==='log10';
    if(!finite.length){svg.append(svgNode('text',{x:width/2,y:150,'text-anchor':'middle',class:'axis-label'},'No available observations in this selection'));return;}

    if(xmax===xmin){xmin-=.5;xmax+=.5;}if(!log){ymin=Math.min(0,ymin);ymax=Math.max(0,ymax);}if(ymax===ymin){ymin-=ymax?Math.abs(ymax)*.1:1;ymax+=ymax?Math.abs(ymax)*.1:1;}else{const span=ymax-ymin;ymax+=span*.08;if(log||ymin<0)ymin-=span*.05;}
    const X=value=>left+(value-xmin)/(xmax-xmin)*(right-left),Y=value=>bottom-((log?Math.log10(value):value)-ymin)/(ymax-ymin)*(bottom-top);
    for(let i=0;i<=4;i++){const value=ymin+(ymax-ymin)*i/4,y=bottom-(bottom-top)*i/4;svg.append(svgNode('line',{x1:left,x2:right,y1:y,y2:y,class:'grid'}),svgNode('text',{x:left-8,y:y+4,'text-anchor':'end',class:'tick'},Number((log?10**value:value).toPrecision(4)).toString()));}
    const tickCount=Math.max(2,Math.floor((right-left)/90));const ticks=numeric?Array.from({length:tickCount+1},(_,i)=>xmin+(xmax-xmin)*i/tickCount):categories.map((_,i)=>i).filter(i=>i%Math.max(1,Math.ceil(categories.length/(tickCount+1)))===0||i===categories.length-1);
    for(const tick of ticks){const text=numeric?Number(tick.toPrecision(4)).toString():categories[tick],node=svgNode('text',{x:X(tick),y:bottom+18,'text-anchor':'end',transform:'rotate(-30 '+X(tick)+' '+(bottom+18)+')',class:'tick'},text.length>12?text.slice(0,11)+'…':text);node.append(svgNode('title',{},text));svg.append(node);}
    svg.append(svgNode('text',{x:(left+right)/2,y:340,'text-anchor':'middle',class:'axis-label'},panel.xlabel+(panel.xunit?' ('+panel.xunit+')':'')),svgNode('text',{x:16,y:(top+bottom)/2,transform:'rotate(-90 16 '+((top+bottom)/2)+')','text-anchor':'middle',class:'axis-label'},panel.ylabel+(panel.unit?' ('+panel.unit+')':'')));
    const groups=new Map();for(const index of indices){const row=rows[index],key=JSON.stringify([row.series,row.version||'']);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(index);}
    const barGroups=[...groups.keys()].filter(key=>rows[groups.get(key)[0]].style==='bar'),distinctX=[...new Set(xs)].sort((a,b)=>a-b),spacing=distinctX.length>1?Math.min(...distinctX.slice(1).map((x,i)=>x-distinctX[i])):1,barSpace=Math.min(36,(right-left)*spacing/(xmax-xmin)*.75);
    const legend=document.createElement('div');legend.className='toolbar';legend.setAttribute('aria-label','Series and versions');wrapper.append(legend);
    for(const [key,group]of groups){const row=rows[group[0]],color=colorFor(row),legendItem=document.createElement('span');legendItem.style.color=color;legendItem.textContent='● '+[row.series,row.version].filter(Boolean).join(' · ');legend.append(legendItem);if(row.style==='line'||row.style==='scatterline'){let segment=[];const flush=()=>{if(segment.length)svg.append(svgNode('path',{d:segment.map((index,i)=>(i?'L':'M')+X(rawX(index))+' '+Y(rows[index].value)).join(' '),stroke:color,class:'curve'}));segment=[];};for(const index of group){if(rows[index].value===null)flush();else segment.push(index);}flush();}
      for(const index of group){const item=rows[index];if(item.value===null)continue;const shift=item.style==='bar'?(barGroups.indexOf(key)-(barGroups.length-1)/2)*barSpace/Math.max(1,barGroups.length):0,x=X(rawX(index))+shift,y=Y(item.value);if(item.style==='bar'){const base=Y(log?10**ymin:Math.max(0,ymin)),width=barSpace/Math.max(1,barGroups.length);svg.append(svgNode('rect',{x:x-width/2,y:Math.min(y,base),width,height:Math.abs(base-y),fill:color,opacity:.65}));}
        const point=svgNode('circle',{cx:x,cy:y,r:4.5,fill:color,class:'point',tabindex:0,'data-index':index,'aria-label':label(item)});point.append(svgNode('title',{},label(item)));point.addEventListener('mouseenter',()=>inspect(index));point.addEventListener('focus',()=>inspect(index));point.addEventListener('click',()=>inspect(index));svg.append(point);}
    }
  }
  function size(){const plots=$('plots');plots.style.width=zoom>1?(100*zoom)+'%':'100%';$('zoom').textContent=Math.round(zoom*100)+'%';}
  function draw(){const active=activeSeries();visible=rows.map((_,i)=>i).filter(i=>(!$('panel').value||rows[i].panel===$('panel').value)&&(!$('version').value||rows[i].version===$('version').value)&&active.has(rows[i].series));$('plots').replaceChildren();const chosen=panels.filter(panel=>!$('panel').value||panel.id===$('panel').value);$('plots').classList.toggle('single',chosen.length===1);for(const panel of chosen)drawPanel(panel,visible.filter(index=>rows[index].panel===panel.id));$('count').textContent=visible.length+' / '+rows.length+' recorded rows';if(rows.length)inspect(selected);else $('readout').textContent='No recorded observations.';size();}
  $('point-index').max=String(rows.length);$('point-index').disabled=!rows.length;$('point-index').addEventListener('input',()=>{const index=Number($('point-index').value)-1;if(!Number.isInteger(index)||index<0||index>=rows.length){$('point-index').setAttribute('aria-invalid','true');$('readout').textContent='Choose a point from 1 to '+rows.length;return;}inspect(index);});
  $('panel').addEventListener('change',draw);$('version').addEventListener('change',draw);
  const fit=()=>{zoom=1;size();$('viewport').scrollTo(0,0)};$('fit').addEventListener('click',fit);$('plus').addEventListener('click',()=>{zoom=Math.min(6,zoom*1.5);size()});$('minus').addEventListener('click',()=>{zoom=Math.max(1,zoom/1.5);size()});
  $('reset').addEventListener('click',()=>{$('panel').value='';$('version').value='';$('series').querySelectorAll('input').forEach(input=>input.checked=true);fit();draw();});
  const download=(name,type,text)=>{const href=URL.createObjectURL(new Blob([text],{type})),link=document.createElement('a');link.href=href;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(href),1000);};
  $('json').addEventListener('click',()=>download('perfchecker-'+model.id+'.json','application/json',JSON.stringify(model,null,2)));
  $('csv').addEventListener('click',()=>{const quote=value=>'"'+String(value??'').replaceAll('"','""')+'"',keys=['panel','series','version','x','xunit','value','unit','label'];const table=[keys,...visible.map(index=>{const row=rows[index],panel=panels.find(panel=>panel.id===row.panel);return keys.map(key=>key==='xunit'||key==='unit'?panel[key]:row[key]);})];download('perfchecker-'+model.id+'.csv','text/csv',table.map(row=>row.map(quote).join(',')).join('\n'));});

  let drag;$('viewport').addEventListener('pointerdown',event=>{if(!event.shiftKey||event.button!==0)return;event.preventDefault();$('viewport').setPointerCapture(event.pointerId);drag={x:event.clientX,left:$('viewport').scrollLeft};});$('viewport').addEventListener('pointermove',event=>{if(drag)$('viewport').scrollLeft=drag.left+drag.x-event.clientX;});$('viewport').addEventListener('pointerup',()=>drag=null);$('viewport').addEventListener('pointercancel',()=>drag=null);
  let lastWidth=document.body.clientWidth,resizePending=false;window.addEventListener('resize',()=>{if(resizePending||document.body.clientWidth===lastWidth)return;resizePending=true;requestAnimationFrame(()=>{resizePending=false;lastWidth=document.body.clientWidth;draw();});});
