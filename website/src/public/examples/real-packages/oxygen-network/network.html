  function draw(){const active=activeSeries();visible=rows.map((_,i)=>i).filter(i=>(!$('panel').value||rows[i].panel===$('panel').value)&&(!$('version').value||rows[i].version===$('version').value)&&active.has(rows[i].series));$('plots').replaceChildren();const chosen=panels.filter(panel=>!$('panel').value||panel.id===$('panel').value);$('plots').classList.toggle('single',chosen.length===1);for(const panel of chosen)drawPanel(panel,visible.filter(index=>rows[index].panel===panel.id));$('count').textContent=visible.length+' / '+rows.length+' recorded rows';if(rows.length)inspect(selected);else $('readout').textContent='No recorded observations.';size();}
  $('point-index').max=String(rows.length);$('point-index').disabled=!rows.length;$('point-index').addEventListener('input',()=>{const index=Number($('point-index').value)-1;if(!Number.isInteger(index)||index<0||index>=rows.length){$('point-index').setAttribute('aria-invalid','true');$('readout').textContent='Choose a point from 1 to '+rows.length;return;}inspect(index);});
  $('panel').addEventListener('change',draw);$('version').addEventListener('change',draw);
  const fit=()=>{zoom=1;size();$('viewport').scrollTo(0,0)};$('fit').addEventListener('click',fit);$('plus').addEventListener('click',()=>{zoom=Math.min(6,zoom*1.5);size()});$('minus').addEventListener('click',()=>{zoom=Math.max(1,zoom/1.5);size()});
  $('reset').addEventListener('click',()=>{$('panel').value='';$('version').value='';$('series').querySelectorAll('input').forEach(input=>input.checked=true);fit();draw();});
  const download=(name,type,text)=>{const href=URL.createObjectURL(new Blob([text],{type})),link=document.createElement('a');link.href=href;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(href),1000);};
  $('json').addEventListener('click',()=>download('perfchecker-'+model.id+'.json','application/json',JSON.stringify(model,null,2)));
  $('csv').addEventListener('click',()=>{const quote=value=>'"'+String(value??'').replaceAll('"','""')+'"',keys=['panel','series','version','x','xunit','value','unit','label'];const table=[keys,...visible.map(index=>{const row=rows[index],panel=panels.find(panel=>panel.id===row.panel);return keys.map(key=>key==='xunit'||key==='unit'?panel[key]:row[key]);})];download('perfchecker-'+model.id+'.csv','text/csv',table.map(row=>row.map(quote).join(',')).join('\n'));});
  $('viewport').addEventListener('keydown',event=>{if(event.target!==$('viewport'))return;if(['+','=','-','0'].includes(event.key))event.preventDefault();if(event.key==='+'||event.key==='=')$('plus').click();if(event.key==='-')$('minus').click();if(event.key==='0')fit();});
  let drag;$('viewport').addEventListener('pointerdown',event=>{if(!event.shiftKey||event.button!==0)return;event.preventDefault();$('viewport').setPointerCapture(event.pointerId);drag={x:event.clientX,left:$('viewport').scrollLeft};});$('viewport').addEventListener('pointermove',event=>{if(drag)$('viewport').scrollLeft=drag.left+drag.x-event.clientX;});$('viewport').addEventListener('pointerup',()=>drag=null);$('viewport').addEventListener('pointercancel',()=>drag=null);
  let lastWidth=document.body.clientWidth,resizePending=false;window.addEventListener('resize',()=>{if(resizePending||document.body.clientWidth===lastWidth)return;resizePending=true;requestAnimationFrame(()=>{resizePending=false;lastWidth=document.body.clientWidth;draw();});});
  draw();
})();
</script></body></html>
